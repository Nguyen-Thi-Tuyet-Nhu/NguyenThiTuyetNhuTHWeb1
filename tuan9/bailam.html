<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra Regex</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input {
            width: 250px;
            padding: 5px;
        }

        button {
            margin-left: 10px;
            padding: 5px 10px;
        }

        p {
            color: blue;
            font-weight: bold;
        }

        .bai {
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <h2>Kiểm Tra Biểu Thức Chính Quy (Regex)</h2>

    <!-- Bài 1 -->
    <div class="bai">
        <h3>Bài 1: Chỉ gồm các chữ số</h3>
        <input type="text" id="txt1">
        <button id="btn1">Kiểm tra</button>
        <p id="result1"></p>
    </div>

    <!-- Bài 2 -->
    <div class="bai">
        <h3>Bài 2: Mã sinh viên gồm đúng 10 chữ số</h3>
        <input type="text" id="txt2">
        <button id="btn2">Kiểm tra</button>
        <p id="result2"></p>
    </div>

    <!-- Bài 3 -->
    <div class="bai">
        <h3>Bài 3: Username (5-15 ký tự)</h3>
        <input type="text" id="txt3">
        <button id="btn3">Kiểm tra</button>
        <p id="result3"></p>
    </div>

    <!-- Bài 4 -->
    <div class="bai">
        <h3>Bài 4: Số điện thoại</h3>
        <input type="text" id="txt4">
        <button id="btn4">Kiểm tra</button>
        <p id="result4"></p>
    </div>

    <!-- Bài 5 -->
    <div class="bai">
        <h3>Bài 5: Email</h3>
        <input type="text" id="txt5">
        <button id="btn5">Kiểm tra</button>
        <p id="result5"></p>
    </div>

    <!-- Bài 6 -->
    <div class="bai">
        <h3>Bài 6: Ngày tháng (dd/mm/yyyy)</h3>
        <input type="text" id="txt6">
        <button id="btn6">Kiểm tra</button>
        <p id="result6"></p>
    </div>

    <script>

        // Bài 1
        $("#btn1").click(function () {
            var chuoi = $("#txt1").val();
            var pattern = /^\d+$/;

            if (pattern.test(chuoi)) {
                $("#result1").text("ĐÚNG");
            } else {
                $("#result1").text("SAI");
            }
        });

        // Bài 2
        $("#btn2").click(function () {
            var chuoi = $("#txt2").val();
            var pattern = /^\d{10}$/;

            if (pattern.test(chuoi)) {
                $("#result2").text("ĐÚNG");
            } else {
                $("#result2").text("SAI");
            }
        });

        // Bài 3
        $("#btn3").click(function () {
            var chuoi = $("#txt3").val();
            var pattern = /^[a-z0-9_]{5,15}$/;

            if (pattern.test(chuoi)) {
                $("#result3").text("ĐÚNG");
            } else {
                $("#result3").text("SAI");
            }
        });

        // Bài 4
        $("#btn4").click(function () {
            var chuoi = $("#txt4").val();
            var pattern = /^0\d{9}$/;

            if (pattern.test(chuoi)) {
                $("#result4").text("ĐÚNG");
            } else {
                $("#result4").text("SAI");
            }
        });

        // Bài 5
        $("#btn5").click(function () {
            var chuoi = $("#txt5").val();
            var pattern = /^\S+@\S+\.\S+$/;

            if (pattern.test(chuoi)) {
                $("#result5").text("ĐÚNG");
            } else {
                $("#result5").text("SAI");
            }
        });

        // Bài 6
        $("#btn6").click(function () {
            var chuoi = $("#txt6").val();
            var pattern = /^[0-9]{2}\/[0-9]{2}\/[0-9]{4}$/;

            if (pattern.test(chuoi)) {
                $("#result6").text("ĐÚNG");
            } else {
                $("#result6").text("SAI");
            }
        });

    </script>

</body>
</html>
