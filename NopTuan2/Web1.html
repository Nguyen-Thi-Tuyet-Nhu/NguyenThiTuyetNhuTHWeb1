<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 1</title>



<style>

    .container {
        display: grid;
        grid-template-areas:
            "menu"
            "search"
            "trend"
            "footer";
        gap: 10px
    }




    .container div.menu{
        grid-area: menu;
    }

    .container div.search{
        grid-area: search;
    }

    .container div.trend{
        grid-area: trend;
    }

    .container div.footer{
        grid-area: footer;
    }




    #menu{
        display:flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
    }


    #menu ul{
        display:flex;
        list-style:none;
        gap:30px;
        }
 



    #menu ul li{
            cursor:pointer;
        }




    #menu div:last-child{
        display:flex;
        align-items:center;
        gap:10px;
        }












    .search{
        display:flex;
        justify-content:center;
        align-items:center;
        gap:15px;
        margin:60px 0;
    }

    .search input{
            width:500px;
            padding:15px;
            border:1px solid #ccc;
            border-radius:30px;
            outline:none;
        }


















    
    .trend {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 0;
        }

    .trend button {
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        background: #007bff;
        color: white;
        cursor: pointer;
        }









    .footer{
            display:flex;
            justify-content:center;
            gap:30px;
            padding:20px;
        }

        .footer a{
            text-decoration:none;
            color:gray;
        }


</style>
</head>




<body>
